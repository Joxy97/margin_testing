# Complete application configuration. Relative paths are resolved from this file.
marginDate: 2024-01-31

portfolio:
  weights:
    AAPL: "10"
    MSFT: "5"
  cash: "0"

# Optional rolling backtest. The root portfolio is named "default" here.
backtest:
  confidenceLevel: 0.998
  outputDirectory: ../backtest_results/example
  dates: [2024-01-29, 2024-01-30, 2024-01-31]

engine:
  # numericalExecution: {type: torch, device: cuda:0, dtype: auto}
  # Opt-in resident returns numerics (ordinary or correlated returns grids).
  # Requires greedy calculation or one Torch SBM/adaptive/SVL solver on the same device.
  # numericalExecution: {type: torch, device: auto}
  # Omit this block for the existing host pipeline, including multi-GPU batching.
  downloadManager:
    providers:
      yahoo:
        type: yfinance
    providerSelection: local_first
    downloadAlgorithm: single_request
    # exponential_backoff retries transient failures per chunk. Example parameters:
    # downloadParameters:
    #   chunker: {type: date, batchSize: 30} # inclusive, nonoverlapping days
    #   time: 1.0       # initial retry delay
    #   maxAttempts: 3  # includes the initial attempt
    #   maxDelay: 60.0  # cap including provider hints and jitter
    #   jitter: 0.0     # additional uniform delay up to jitter * retry delay
    #   requestInterval: 0.0 # constant pause between chunks; no trailing sleep
    downloadParameters: {}
    requestParameters: {}

  dataManager:
    cacheType: lru
    memorySize: 16
    maxMemoryBytes: 268435456
    backingStore:
      type: partitioned_pickle
      directory: .cache/market-data

  riskStateGenerator:
    type: correlated_returns_vola_grid
    pcaGridProvider:
      cacheType: lru
      memorySize: 128
      backend:
        type: numpy # Use torch for optional GPU PCA.
        device: auto # Torch accepts cpu, cuda, or cuda:<index> as well.
        dtype: auto # Torch: float32 on GPU, float64 on CPU; override with float64.
    ew_window: 60
    ew_lambda: 0.94
    components: 2
    scenariosPerComponents: [21, 5]
    tailDensityGamma: 1.0
    nZBins: 21
    nNearest: 40
    residualSigmaRange: 5.0
    allowEmptyBinFallback: true
    distanceInflationAlpha: 0.5
    distanceInflationPower: 2.0
    maxInflationFactor: 5.0
    topKNeighbors: 5
    correlationBlockBytes: 134217728

  marginCalculator:
    type: bqm
    # Evaluate the greedy baseline while consuming this exact risk-state stream.
    comparison:
      type: state_aware_greedy
      pnlAnchor: market
    modelParameters:
      lambdaOneHot: 2.0
      # Correlation-derived coefficients are divided by their scenario-wide
      # absolute maximum and pruned below 0.01 before applying this weight.
      lambdaCompat: 0.1
    structuralCacheMemorySize: 16
    executionPolicy:
      type: batch
      batchSize: 105
      maxBatchBytes: 536870912
      memoryMultiplier: 3.0
      prefetch: true # Prepare one additional host batch during GPU execution.
    solver:
      type: torch_svl
      constructorParameters:
        device: auto
        # For multi-GPU execution, remove device and configure, for example:
        # devices: [cuda:0, cuda:1, cuda:2, cuda:3, cuda:4, cuda:5, cuda:6, cuda:7]
      solverParameters:
        steps: 4000
        runs: 64
        seed: 1
        dtype: float32
        run_batch_size: 16
        energy_chunk_size: 1000000
        noise_chunk_size: 16
        integrator: weak_order_2
        dt: 0.01
        mass: 1.0
        damping: 0.1
        temperature: 0.001
        transverse_field_initial: 1.0
        transverse_field_final: 0.0
        problem_scale_initial: 0.0
        problem_scale_final: 1.0

# Feasibility-preserving alternative for complete one-hot returns portfolios:
# Replace the solver block (SBM/SVL-specific parameters do not apply):
# solver:
#   type: torch_categorical
#   constructorParameters: {device: cuda:0}
#   solverParameters:
#     steps: 64 # Full graph-color sweeps, not SBM/SVL integration steps.
#     runs: 16
#     temperature_start: 1.0 # In objective energy units.
#     temperature_end: 0.01
#     greedy_sweeps: 4 # Feasible zero-temperature updates; no repair.
#     dtype: float32
#     run_batch_size: 16
#     noise_chunk_size: 16
#     energy_chunk_size: 1000000
#     seed: 1

# General binary angular-flow alternative (replace the entire solver block):
# solver:
#   type: torch_transverse_route
#   constructorParameters: {device: auto}
#   solverParameters:
#     steps: 1000
#     runs: 64
#     run_batch_size: 16
#     integrator: euler # Or heun, which evaluates two slopes per step.
#     time_step: 0.05
#     route_strength: 1.0
#     gamma: 0.0
#     kappa_initial: -1.0
#     kappa_final: 2.0
#     candidate_interval: 25
#     candidate_batch_size: 128
#     matrix_format: sparse
#     cuda_graph: true
# See transverse_route.example.yaml for the complete runnable configuration.
