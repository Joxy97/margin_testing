# Full-parent FHS-EVT backtest: no 105-scenario medoid reduction.
marginDate: 2025-01-01

portfolio:
  csv: ../../synthetic_market/assets_00200/portfolio.csv
  clientId: synthetic_0000
  cash: "0"

backtest:
  confidenceLevel: 0.998
  outputDirectory: ../../backtest_results/fhs_evt_3sigma_tail10_full/assets_00200
  datesFromCsv:
    path: ../../synthetic_market/assets_00200/backtest_close.csv
    startDate: 2025-01-01
    endDate: 2025-12-26

engine:
  downloadManager:
    providers:
      synthetic_csv:
        type: local_csv
    providerSelection: local_first
    downloadAlgorithm: single_request
    downloadParameters: {}
    requestParameters:
      locations:
        - ../../synthetic_market/assets_00200/historical_close.csv
        - ../../synthetic_market/assets_00200/backtest_close.csv

  dataManager:
    cacheType: lru
    memorySize: 16
    maxMemoryBytes: 268435456

  riskStateGenerator:
    type: fhs_evt
    historyDays: 1825
    minimumObservations: 252
    meanModel: ar
    arOrder: 3
    varianceModel: gjr_garch
    burnIn: 10
    ewmaLambda: 0.94
    persistenceBuffer: 0.005
    optimizerMaxIterations: 500
    rowWeightDecay: 1.0
    tailMassCandidates: [0.10]
    minimumTailObservations: 20
    # Small-sample EVT regularization: |xi| <= 0.20 guarantees finite fourth
    # moments while retaining heavier-than-exponential fitted tails.
    evtShapeLowerBound: -0.20
    evtShapeUpperBound: 0.20
    evtQuadraturePoints: 512
    thresholdStabilityTolerance: 0.20
    # Two antithetic nodes produce 496 probability states of about 0.2016%
    # mass each, closely matching the configured 0.2% one-sided tail level.
    integrationNodes: 2
    endpointProbability: 1.0e-10
    stressSigmaLevels: [3]
    targetScenarios: 105
    reduceScenarios: false
    protectProbabilityExtremes: true
    localSwapPasses: 1
    recalibrationIntervalDays: 366
    calibrationWorkers: 1
    modelVersion: fhs-evt-ar3-burn10-tail10-3sigma-full-nodes2-xi20-v1

  marginCalculator:
    type: state_aware_greedy
    pnlAnchor: market
