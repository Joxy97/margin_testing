# MarginLab Vanguard 2024-26 portfolio rolling backtest.
marginDate: 2025-01-01

portfolio:
  csv: ../../vanguard_market/vanguard_portfolio_202426_marginlab_complete_history.csv
  clientId: vanguard_202426
  cash: "0"

backtest:
  confidenceLevel: 0.998
  outputDirectory: ../../backtest_results/vanguard_202426
  datesFromCsv:
    path: ../../vanguard_market/vanguard_portfolio_202426_marginlab_close_backtest_2025.csv
    startDate: 2025-01-01
    endDate: 2025-12-31

engine:
  downloadManager:
    providers:
      vanguard_csv:
        type: local_csv
    providerSelection: local_first
    downloadAlgorithm: single_request
    downloadParameters: {}
    requestParameters:
      locations:
        - ../../vanguard_market/vanguard_portfolio_202426_marginlab_close_history_2024.csv
        - ../../vanguard_market/vanguard_portfolio_202426_marginlab_close_backtest_2025.csv

  dataManager:
    cacheType: lru
    memorySize: 16
    maxMemoryBytes: 268435456

  riskStateGenerator:
    type: correlated_returns_vola_grid
    pcaGridProvider:
      cacheType: lru
      memorySize: 128
    ew_window: 125
    ew_lambda: 0.93
    components: 2
    scenariosPerComponents: [21, 5]
    tailDensityGamma: 1.0
    nZBins: 21
    nNearest: null
    residualSigmaRange: 5.0
    allowEmptyBinFallback: true
    distanceInflationAlpha: 0.5
    distanceInflationPower: 2.0
    maxInflationFactor: 5.0
    topKNeighbors: 5
    correlationBlockBytes: 134217728

  marginCalculator:
    type: bqm
    modelParameters:
      lambdaOneHot: 1.0
      lambdaCompat: 0.1
    structuralCacheMemorySize: 16
    executionPolicy:
      type: batch
      batchSize: 105
      maxBatchBytes: 536870912
      memoryMultiplier: 3.0
    solver:
      type: adaptive_torch_sbm
      constructorParameters:
        devices: [cuda:0, cuda:1, cuda:2, cuda:3, cuda:4, cuda:5, cuda:6, cuda:7]
      solverParameters:
        steps: 1000
        runs: 16
        mode: discrete
        dt: 0.1
        a0: 1.0
        c0: 0.02
        gamma: 0.0
        initial_scale: 0.1
        pressure_slope: 0.01
        heated: false
        early_stopping: true
        sampling_period: 30
        convergence_threshold: 5
        track_best: true
        local_search_sweeps: 1
        seed: 20260603
        dtype: float32
        run_batch_size: null
        energy_chunk_size: 1000000
