# Full feasible-range PCA/returns-volatility-grid backtest for the real Yahoo
# 200-asset portfolio. Dates are aligned with the companion FHS-EVT run.
marginDate: 2021-11-15

portfolio:
  csv: ../../yahoo_history_downloader/portfolio.csv
  clientId: synthetic_0000
  cash: "0"

backtest:
  confidenceLevel: 0.998
  outputDirectory: ../../backtest_results/yahoo_00200_pc_vs_fhs_evt_full_nodes2_xi20/pca
  datesFromCsv:
    path: ../../yahoo_history_downloader/yahoo_output_2020_2026-09-03/historical_close_200.csv
    startDate: 2021-11-15
    endDate: 2026-09-03

engine:
  downloadManager:
    providers:
      yahoo_history_csv:
        type: local_csv
    providerSelection: local_first
    downloadAlgorithm: single_request
    downloadParameters: {}
    requestParameters:
      location: ../../yahoo_history_downloader/yahoo_output_2020_2026-09-03/historical_close_200.csv

  dataManager:
    cacheType: lru
    memorySize: 16
    maxMemoryBytes: 536870912

  riskStateGenerator:
    type: returns_vola_grid
    pcaGridProvider:
      cacheType: lru
      memorySize: 128
    ew_window: 125
    ew_lambda: 0.93
    components: 2
    scenariosPerComponents: [21, 5]
    tailDensityGamma: 1.0
    nZBins: 21
    nNearest: null
    residualSigmaRange: 5.0
    allowEmptyBinFallback: true
    distanceInflationAlpha: 0.5
    distanceInflationPower: 2.0
    maxInflationFactor: 5.0

  marginCalculator:
    type: greedy
