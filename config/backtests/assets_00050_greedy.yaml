# Greedy synthetic-market rolling backtest.
marginDate: 2025-01-01

portfolio:
  csv: ../../synthetic_market/assets_00050/portfolio.csv
  clientId: synthetic_0000
  cash: "0"

backtest:
  confidenceLevel: 0.998
  outputDirectory: ../../backtest_results/greedy/assets_00050
  datesFromCsv:
    path: ../../synthetic_market/assets_00050/backtest_close.csv
    startDate: 2025-01-01
    endDate: 2025-12-26

engine:
  downloadManager:
    providers:
      synthetic_csv:
        type: local_csv
    providerSelection: local_first
    downloadAlgorithm: single_request
    downloadParameters: {}
    requestParameters:
      locations:
        - ../../synthetic_market/assets_00050/historical_close.csv
        - ../../synthetic_market/assets_00050/backtest_close.csv

  dataManager:
    cacheType: lru
    memorySize: 16
    maxMemoryBytes: 268435456

  riskStateGenerator:
    type: returns_vola_grid
    pcaGridProvider:
      cacheType: lru
      memorySize: 128
    ew_window: 125
    ew_lambda: 0.93
    components: 2
    scenariosPerComponents: [21, 5]
    tailDensityGamma: 1.0
    nZBins: 21
    nNearest: null
    residualSigmaRange: 5.0
    allowEmptyBinFallback: true
    distanceInflationAlpha: 0.5
    distanceInflationPower: 2.0
    maxInflationFactor: 5.0
  marginCalculator:
    type: greedy
